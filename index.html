<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="links/styles.css">
  <script defer src="links/Task.js"></script>
  <title>Planner app</title>
</head>
<body>

<section class="homePage" style="flex-direction: column;">

<header>
  <div id="logo"><h2>myPlanner</h2></div>
  <div class="settings">
    <button id="setIcon"></button>
  </div>
</header>

<main class="content">

  <aside id="taskScroll">
    <header><h2>Upcoming :</h2></header>
    <main>
      <div id="upComing"></div>
    </main>
  </aside>

  <div id="calanderBox">
    <header>
      <div class="additional">
        <div id="addTask"><h3>Add</h3></div>

        <div id="Taskscreen" style="display:none;">
          <main>
            <form id="taskForm">
              <div>
                <label>Taaknaam</label>
                <input id="taskName" required>
              </div>

              <div>
                <label>Datum</label>
                <input type="date" id="taskDate">
              </div>

              <div>
                <label>Taaknotities</label>
                <textarea id="taskNotes"></textarea>
              </div>

              <div>
                <label>Tijd</label>
                <input type="time" id="taskTime">
              </div>

              <div>
                <label>Prioriteit</label>
                <select id="taskPriority">
                  <option value="low">Low</option>
                  <option value="medium">Medium</option>
                  <option value="high">High</option>
                </select>
              </div>

              <div>
                <button type="button" id="closeTaskWindow">Back</button>
                <button type="submit">Save</button>
              </div>
            </form>
          </main>
        </div>

      </div>
    </header>

    <div id="calendar"></div>
  </div>

</main>

<aside id="settingsTab" style="display:none;">
  <header id="tabHeader">
    <button id="setBack">Back</button>
    <h1>settings</h1>
  </header>
</aside>

</section>

</body>
</html>
